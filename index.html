<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infoskärm - Presentation med Klocka</title>
  <style>
    /* Nollställ marginaler och lås vyporten för helskärm */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    /* Presentationslager */
    #presentation-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #presentation-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Klocka i övre vänstra hörnet */
    #clock-overlay {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 10;
      
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      
      pointer-events: none;
      user-select: none;
    }

    #clock-time {
      color: #ffffff;
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.05em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.7);
    }

    #clock-date {
      color: #d1d5db;
      font-size: 0.85rem;
      font-weight: 400;
      margin-top: 4px;
      text-transform: capitalize;
    }
  </style>
</head>
<body>

  <!-- Google Presentation -->
  <div id="presentation-container">
    <iframe 
      id="presentation-frame"
      src="about:blank"
      allowfullscreen="true"
      mozallowfullscreen="true"
      webkitallowfullscreen="true">
    </iframe>
  </div>

  <!-- Digital klocka -->
  <div id="clock-overlay">
    <div id="clock-time">00:00</div>
    <div id="clock-date">Laddar...</div>
  </div>

  <script>
    // --- Konfiguration ---
    const PRESENTATION_URL = "https://docs.google.com/presentation/d/e/2PACX-1vQdvm58L1ldwHdythef5TPKYRNPeGoVJYmxC7llHReMvCeVLJmqSaUtC2EF6hZX3Pk5rIuedMOpyuoc/embed"

    const START_HOUR = 7;
    const START_MINUTE = 30;
    const END_HOUR = 17;
    const END_MINUTE = 0;

    // Endast aktiv måndag–fredag (helger är alltid avstängda)
    const WEEKDAYS_ONLY = true;

    // Släcker även klockan när skärmen är avstängd (blir helsvart)
    const HIDE_CLOCK_WHEN_INACTIVE = true;

    let isActiveState = null;

    // --- 1. Klocka och schemastyrning ---
    function updateDisplayAndSchedule() {
      const now = new Date();
      
      // Uppdatera klockans siffror
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock-time').textContent = `${hours}:${minutes}`;

      const options = { weekday: 'short', day: 'numeric', month: 'short' };
      document.getElementById('clock-date').textContent = now.toLocaleDateString('sv-SE', options);

      // Beräkna klockslag
      const currentMinuteOfDay = now.getHours() * 60 + now.getMinutes();
      const startMinute = START_HOUR * 60 + START_MINUTE; // 07:30
      const endMinute = END_HOUR * 60 + END_MINUTE;       // 17:00

      let shouldBeActive = currentMinuteOfDay >= startMinute && currentMinuteOfDay < endMinute;

      // Helgkontroll: 0 = Söndag, 6 = Lördag
      if (WEEKDAYS_ONLY) {
        const day = now.getDay();
        if (day === 0 || day === 6) {
          shouldBeActive = false;
        }
      }

      // Ändra DOM-läge endast när läget faktiskt växlar
      if (shouldBeActive !== isActiveState) {
        isActiveState = shouldBeActive;
        applyScheduleState(shouldBeActive);
      }
    }

    function applyScheduleState(active) {
      const container = document.getElementById('presentation-container');
      const iframe = document.getElementById('presentation-frame');
      const clock = document.getElementById('clock-overlay');

      if (active) {
        // Starta: ladda in presentationen och visa allt
        iframe.src = PRESENTATION_URL;
        container.style.display = 'block';
        clock.style.display = 'block';
      } else {
        // Stäng av: töm iframen (sparar RAM/CPU/bandbredd) och släck skärmen
        iframe.src = 'about:blank';
        container.style.display = 'none';
        if (HIDE_CLOCK_WHEN_INACTIVE) {
          clock.style.display = 'none';
        }
      }
    }

    // Kör direkt vid sidladdning och sedan varje sekund
    updateDisplayAndSchedule();
    setInterval(updateDisplayAndSchedule, 1000);

    // --- 2. Mjuk omläsning (var 15:e minut under öppettid) ---
    // Uppdaterar presentationen i bakgrunden så att nya bilder syns
    const SLIDE_REFRESH_MINUTES = 15;
    setInterval(function() {
      if (isActiveState) {
        const iframe = document.getElementById('presentation-frame');
        if (iframe) {
          iframe.src = PRESENTATION_URL;
        }
      }
    }, SLIDE_REFRESH_MINUTES * 60 * 1000);

    // --- 3. Nattlig rensning (varje natt kl. 03:00) ---
    // Gör en full sidomladdning för att rensa Chromeboxens minne
    setInterval(function() {
      const now = new Date();
      if (now.getHours() === 3 && now.getMinutes() === 0) {
        window.location.reload();
      }
    }, 60 * 1000);
  </script>
</body>
</html>
