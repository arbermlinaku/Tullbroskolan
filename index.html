<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infoskärm - Tullbroskolan</title>
  <style>
    /* Nollställ marginaler och fyll hela vyporten */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    /* Presentationslager */
    #presentation-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #presentation-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Klockans bakgrundsruta - uppskalad för att rymma den större texten */
    #clock-overlay {
      position: fixed;
      top: 30px;
      left: 30px;
      z-index: 10;
      
      background: rgba(0, 0, 0, 0.70);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      
      padding: 18px 32px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
      
      pointer-events: none;
      user-select: none;
    }

    /* Klockans siffror - dubbel storlek (4.4rem) */
    #clock-time {
      color: #ffffff;
      font-size: 4.4rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 3px 6px rgba(0, 0, 0, 0.8);
    }

    /* Datumtext - dubbel storlek (1.7rem) */
    #clock-date {
      color: #d1d5db;
      font-size: 1.7rem;
      font-weight: 500;
      margin-top: 8px;
      text-transform: capitalize;
    }
  </style>
</head>
<body>

  <!-- Google Presentation -->
  <div id="presentation-container">
    <iframe 
      id="presentation-frame"
      src="about:blank"
      allowfullscreen="true"
      mozallowfullscreen="true"
      webkitallowfullscreen="true">
    </iframe>
  </div>

  <!-- Förstorad klocka i övre vänstra hörnet -->
  <div id="clock-overlay">
    <div id="clock-time">00:00</div>
    <div id="clock-date">Laddar...</div>
  </div>

  <script>
    // URL med /embed för att tillåta inbäddning
    const PRESENTATION_URL = "https://docs.google.com/presentation/d/e/2PACX-1vQdvm58L1ldwHdythef5TPKYRNPeGoVJYmxC7llHReMvCeVLJmqSaUtC2EF6hZX3Pk5rIuedMOpyuoc/embed?start=true&loop=true&delayms=5000&rm=minimal";

    const START_HOUR = 7;
    const START_MINUTE = 30;
    const END_HOUR = 17;
    const END_MINUTE = 0;
    const WEEKDAYS_ONLY = true;
    const HIDE_CLOCK_WHEN_INACTIVE = true;

    let isActiveState = null;

    // 1. Uppdatera klocka, datum och schema
    function updateDisplayAndSchedule() {
      const now = new Date();
      
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock-time').textContent = `${hours}:${minutes}`;

      const options = { weekday: 'short', day: 'numeric', month: 'short' };
      document.getElementById('clock-date').textContent = now.toLocaleDateString('sv-SE', options);

      const currentMinuteOfDay = now.getHours() * 60 + now.getMinutes();
      const startMinute = START_HOUR * 60 + START_MINUTE;
      const endMinute = END_HOUR * 60 + END_MINUTE;

      let shouldBeActive = currentMinuteOfDay >= startMinute && currentMinuteOfDay < endMinute;

      if (WEEKDAYS_ONLY) {
        const day = now.getDay();
        if (day === 0 || day === 6) {
          shouldBeActive = false;
        }
      }

      if (shouldBeActive !== isActiveState) {
        isActiveState = shouldBeActive;
        applyScheduleState(shouldBeActive);
      }
    }

    function applyScheduleState(active) {
      const container = document.getElementById('presentation-container');
      const iframe = document.getElementById('presentation-frame');
      const clock = document.getElementById('clock-overlay');

      if (active) {
        iframe.src = PRESENTATION_URL;
        container.style.display = 'block';
        clock.style.display = 'block';
      } else {
        iframe.src = 'about:blank';
        container.style.display = 'none';
        if (HIDE_CLOCK_WHEN_INACTIVE) {
          clock.style.display = 'none';
        }
      }
    }

    updateDisplayAndSchedule();
    setInterval(updateDisplayAndSchedule, 1000);

    // 2. Mjuk omläsning var 15:e minut under drift
    const SLIDE_REFRESH_MINUTES = 15;
    setInterval(function() {
      if (isActiveState) {
        const iframe = document.getElementById('presentation-frame');
        if (iframe) {
          iframe.src = PRESENTATION_URL;
        }
      }
    }, SLIDE_REFRESH_MINUTES * 60 * 1000);

    // 3. Full minnesrensning kl. 03:00 på natten
    setInterval(function() {
      const now = new Date();
      if (now.getHours() === 3 && now.getMinutes() === 0) {
        window.location.reload();
      }
    }, 60 * 1000);
  </script>
</body>
</html>
