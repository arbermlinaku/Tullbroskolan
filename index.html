<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infoskärm - Presentation med Klocka</title>
  <style>
    /* Nollställ marginaler och lås vyporten för helskärm */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    /* Presentationslager i botten */
    #presentation-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #presentation-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Klocka - fast position i övre vänstra hörnet */
    #clock-overlay {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 10;
      
      /* Halvtransparent mörk bakgrund med suddning för maximal läsbarhet */
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      
      /* Gör elementet "osynligt" för musklick och markering */
      pointer-events: none;
      user-select: none;
    }

    /* Klockans siffror */
    #clock-time {
      color: #ffffff;
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.05em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.7);
    }

    /* Klockans datum */
    #clock-date {
      color: #d1d5db;
      font-size: 0.85rem;
      font-weight: 400;
      margin-top: 4px;
      text-transform: capitalize;
    }
  </style>
</head>
<body>

  <!-- Google Presentation i bakgrunden -->
  <div id="presentation-container">
    <iframe 
      id="presentation-frame"
      src="https://docs.google.com/presentation/d/e/2PACX-1vQdvm58L1ldwHdythef5TPKYRNPeGoVJYmxC7llHReMvCeVLJmqSaUtC2EF6hZX3Pk5rIuedMOpyuoc/pub?start=true&loop=true&delayms=5000&rm=minimal"
      allowfullscreen="true"
      mozallowfullscreen="true"
      webkitallowfullscreen="true">
    </iframe>
  </div>

  <!-- Permanent digital klocka i övre vänstra hörnet -->
  <div id="clock-overlay">
    <div id="clock-time">00:00</div>
    <div id="clock-date">Laddar...</div>
  </div>

  <script>
    // 1. Uppdatera klocka och datum varje sekund
    function updateClock() {
      const now = new Date();
      
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock-time').textContent = `${hours}:${minutes}`;

      const options = { weekday: 'short', day: 'numeric', month: 'short' };
      document.getElementById('clock-date').textContent = now.toLocaleDateString('sv-SE', options);
    }

    updateClock();
    setInterval(updateClock, 1000);

    // 2. Mjuk omläsning (Soft Refresh) var 15:e minut
    // Laddar om iframen i bakgrunden så att ändringar i bildspelet syns utan avbrott
    const SLIDE_REFRESH_MINUTES = 15;
    setInterval(function() {
      const iframe = document.getElementById('presentation-frame');
      if (iframe) {
        iframe.src = iframe.src;
      }
    }, SLIDE_REFRESH_MINUTES * 60 * 1000);

    // 3. Hård omläsning en gång per dygn för att rensa webbläsarens minne
    const FULL_RELOAD_HOURS = 24;
    setTimeout(function() {
      window.location.reload();
    }, FULL_RELOAD_HOURS * 60 * 60 * 1000);
  </script>
</body>
</html>
